name: Reproduce and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproduction-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - name: Install pinned numerical dependencies
        run: python -m pip install -r requirements-tested.txt
      - name: Reconstruct and run 180 numerical checks
        run: python -B scripts/reproduce.py
      - name: Check documentation and archived-analysis preservation
        run: python -B tools/verify_repository.py
      - name: Retain reproducibility reports and generated figures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            results/*VERIFICATION*.json
            results/PACKAGE_INTEGRITY.json
            results/ENVIRONMENT.json
            results/SUMMARY_V2.json
            results/FIGURE_MANIFEST_V2_2.json
            figures/*.pdf
            figures/*.png
          if-no-files-found: warn
          retention-days: 14
